worker_processes 1;

events {
    worker_connections 1024;
}

http {

    upstream app {
        server host.docker.internal:8080;
    }

    server {
        listen 8000;
        server_name localhost;

        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /proxyAuth {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /images/ {
            auth_request /proxyAuth;
            alias /media/;
        }
    }
}